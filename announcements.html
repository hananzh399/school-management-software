<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements</title>
    <link rel="icon" type="image/png" href="logo-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="manage-staff.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="announcements.css">
    <script>(function(){const t=localStorage.getItem('eduflow-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
    <script src="access-control.js"></script>
</head>
<body class="am-page">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand"><img src="logo-icon.png" alt="SoftSchool Logo" class="brand-logo"><span class="brand-name">Soft<strong>School</strong></span></div>
            <button id="close-sidebar" class="close-btn" aria-label="Close sidebar"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-search"><i class="fas fa-search"></i><input type="text" id="nav-search" placeholder="Search menu..."></div>
        <nav class="sidebar-nav">
            <div class="nav-label">Menu</div>
            <a href="main.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
            <a href="manage-students.html" class="nav-link"><i class="fas fa-user-graduate"></i><span>Student Management</span></a>
            <a href="manage-staff.html" class="nav-link"><i class="fas fa-chalkboard-teacher"></i><span>Staff Management</span></a>
            <a href="attendance.html" class="nav-link"><i class="fas fa-clipboard-check"></i><span>Attendance</span></a>
            <a href="manage-finance.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i><span>Fees &amp; Finance</span></a>
            <a href="reports.html" class="nav-link"><i class="fas fa-chart-pie"></i><span>Reports &amp; Analytics</span></a>
            <a href="announcements.html" class="nav-link active"><i class="fas fa-bullhorn"></i><span>Announcements</span><em class="nav-badge" id="nav-ann-badge" hidden></em></a>
            <a href="settings.html" class="nav-link"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-link logout-btn" id="logout-link"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="header-left">
                <button id="open-sidebar" class="menu-toggle" aria-label="Open sidebar"><i class="fas fa-bars"></i></button>
                <div class="school-branding"><h1 class="school-name" id="school-name">SOFTSCHOOL</h1></div>
            </div>
            <div class="header-right">
                <div class="header-date" id="header-date"></div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="theme-icon-moon"></i><i class="fas fa-sun" id="theme-icon-sun"></i><div class="toggle-slider"></div>
                </button>
            </div>
        </header>

        <section class="am-title">
            <h2><i class="fas fa-bullhorn"></i> Announcements <span>&amp; Messages</span></h2>
            <div class="am-tools">
                <button class="am-tool" id="am-sound" type="button" title="Message sound" aria-label="Message sound"><i class="fas fa-volume-high"></i></button>
                <button class="am-tool" id="am-bell" type="button" title="Push notifications"><i class="fas fa-bell"></i><span>Notifications</span></button>
            </div>
        </section>

        <section class="am-wrap" id="am-wrap">
            <!-- conversation list -->
            <div class="am-list">
                <div class="am-list-top">
                    <div class="am-search"><i class="fas fa-search"></i><input id="am-q" placeholder="Search name, ID or student" autocomplete="off"></div>
                </div>
                <div class="am-tabs" id="am-tabs">
                    <button class="on" data-f="all">All <b id="cnt-all"></b></button>
                    <button data-f="teacher"><i class="fas fa-chalkboard-teacher"></i> Teachers <b id="cnt-teacher"></b></button>
                    <button data-f="parent"><i class="fas fa-people-roof"></i> Parents <b id="cnt-parent"></b></button>
                    <button data-f="unread" title="Unread only"><i class="fas fa-envelope"></i></button>
                </div>
                <div class="am-threads" id="am-threads"></div>
                <button class="am-fab" id="am-new" type="button" title="New message" aria-label="New message"><i class="fas fa-pen"></i></button>
            </div>
            <!-- chat -->
            <div class="am-chat" id="am-chat"></div>
        </section>
    </main>

    <!-- new message: one person or a group -->
    <div class="am-modal" id="am-modal" hidden>
        <div class="am-sheet">
            <div class="am-sheet-head"><b>New message</b><button id="am-close" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button></div>
            <div class="am-seg" id="am-who"><button class="on" data-who="teacher" type="button"><i class="fas fa-chalkboard-teacher"></i> Teachers</button><button data-who="parent" type="button"><i class="fas fa-people-roof"></i> Parents</button></div>
            <div class="am-modes" id="am-modes"></div>
            <div class="am-class" id="am-class-wrap" hidden><select id="am-class"></select></div>
            <div class="am-pickbox" id="am-pickbox" hidden>
                <div class="am-search"><i class="fas fa-search"></i><input id="pick-q" placeholder="Search by name or ID" autocomplete="off"></div>
                <div class="am-pickbar"><button type="button" id="pick-all">Select shown</button><button type="button" id="pick-none">Clear</button><span id="pick-n"></span></div>
                <div class="am-pick" id="am-pick"></div>
            </div>
            <div class="am-to" id="am-to"></div>
            <div class="am-cm-compose">
                <textarea id="cm-text" rows="2" maxlength="1000" placeholder="Write your message…"></textarea>
                <button class="am-send" id="cm-send" type="button" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- message actions + delete confirmation -->
    <div class="am-menu" id="am-menu" hidden></div>
    <div class="am-modal" id="am-confirm" hidden>
        <div class="am-sheet am-small">
            <b>Delete this message?</b>
            <p>It will be removed for the teacher or parent as well.</p>
            <div class="am-btnrow"><button type="button" id="cf-no" class="am-ghost">Cancel</button><button type="button" id="cf-yes" class="am-danger">Delete</button></div>
        </div>
    </div>

    <div class="am-toast" id="am-toast" hidden></div>
    <script src="shared-data.js"></script>
    <script src="announce-badge.js"></script>
    <script src="announcements.js"></script>
</body>
</html>
