<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F423D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Teacher Portal | SoftSchool</title>
<link rel="icon" type="image/png" href="logo-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="teacher-portal.css">
</head>
<body>
<div class="app">
  <header class="appbar">
    <img src="logo-icon.png" alt="" class="appbar-logo">
    <div class="appbar-text">
      <h1 id="page-title">Home</h1>
      <p id="page-date"></p>
    </div>
    <button class="icon-btn" id="btn-refresh" aria-label="Refresh"><i class="fas fa-rotate"></i></button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="home" class="tab active"><i class="fas fa-house"></i><span>Home</span></button>
    <button data-tab="classes" class="tab"><i class="fas fa-chalkboard"></i><span>Classes</span></button>
    <button data-tab="attendance" class="tab"><i class="fas fa-clipboard-check"></i><span>Attendance</span></button>
    <button data-tab="profile" class="tab"><i class="fas fa-user"></i><span>Profile</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="teacher-auth.js"></script>
<script src="teacher-portal.js"></script>
</body>
</html>
