<!DOCTYPE html>
<html lang="en">
<head>
  <script src="parent-portal-guard.js"></script>
  <script src="parent-portal-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2E8B7A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title data-i18n="docTitleChat">Chat · Greenwood High</title>
  <script src="parent-portal-i18n.js"></script>
  <link rel="stylesheet" href="parent-portal-app.css">
  <link rel="stylesheet" href="parent-portal-i18n.css">
  <link rel="stylesheet" href="parent-portal-siblings.css">
</head>
<body class="page-dashboard page-chat">
  <div class="app-shell">

    <!-- ===== Chat Top Bar ===== -->
    <header class="app-topbar chat-topbar">
      <a href="parent-portal-messages.html" class="icon-btn" aria-label="Back to messages" data-i18n-aria="backMessagesAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </a>

      <div class="chat-topbar-info">
        <div class="chat-topbar-avatar-wrap">
          <div class="chat-topbar-avatar" id="chatTopAvatar">RS</div>
          <span class="chat-topbar-dot" id="chatTopDot"></span>
        </div>
        <div class="chat-topbar-text">
          <span class="chat-topbar-name" id="chatTopName">Mrs. Ritu Sharma</span>
          <span class="chat-topbar-meta">
            <span class="chat-topbar-subject" id="chatTopSubject">Mathematics</span>
            <span class="chat-topbar-sep" aria-hidden="true"></span>
            <span class="chat-topbar-presence" id="chatTopPresence">Online</span>
          </span>
          <span class="chat-topbar-child" id="chatTopChild" hidden></span>
        </div>
      </div>

      <div class="chat-menu-wrap">
        <button type="button" class="icon-btn" id="chatMenuBtn" aria-label="More options" data-i18n-aria="moreOptionsAria" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"/>
            <circle cx="12" cy="5" r="1"/>
            <circle cx="12" cy="19" r="1"/>
          </svg>
        </button>
        <div class="chat-menu" id="chatMenu" role="menu" hidden>
          <button type="button" class="chat-menu-item" role="menuitem" data-action="mark-unread">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span data-i18n="markUnread">Mark as unread</span>
          </button>
          <button type="button" class="chat-menu-item is-danger" role="menuitem" data-action="clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            <span data-i18n="clearChat">Clear chat</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ===== Conversation ===== -->
    <div class="chat-stage">
      <main class="chat-messages" id="chatMessages" role="log" aria-label="Conversation" data-i18n-aria="conversationAria"></main>

      <button type="button" class="chat-scroll-btn" id="chatScrollBtn" aria-label="Scroll to latest message" data-i18n-aria="scrollLatestAria" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div class="chat-toast" id="chatToast" role="status" aria-live="polite"></div>
    </div>

    <!-- ===== Quick replies (shown when the teacher sent the last message) ===== -->
    <div class="chat-quick" id="chatQuick" aria-label="Quick replies" data-i18n-aria="quickRepliesAria" hidden></div>

    <!-- ===== Editing banner ===== -->
    <div class="chat-edit-bar" id="chatEditBar" hidden>
      <svg class="chat-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <div class="chat-edit-body">
        <span class="chat-edit-title" data-i18n="editingMessage">Editing message</span>
        <span class="chat-edit-text" id="chatEditText"></span>
      </div>
      <button type="button" class="chat-edit-cancel" id="chatEditCancel" aria-label="Cancel editing" data-i18n-aria="cancelEditAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- ===== Message Input Bar ===== -->
    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <textarea
          id="chatInput"
          class="chat-input"
          placeholder="Type a message" data-i18n-placeholder="typeMessage"
          rows="1"
          maxlength="1000"
          aria-label="Type a message" data-i18n-aria="typeMessage"
        ></textarea>
      </div>

      <button type="button" class="chat-send-btn" id="chatSendBtn" aria-label="Send message" data-i18n-aria="sendMessageAria" disabled>
        <svg class="chat-send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <svg class="chat-save-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>

    <!-- ===== Message info / edit / delete sheet ===== -->
    <div class="chat-sheet-overlay" id="chatSheetOverlay" hidden></div>
    <div class="chat-sheet" id="chatSheet" role="dialog" aria-modal="true" aria-label="Message info" data-i18n-aria="messageInfo" hidden>
      <p class="chat-sheet-title" data-i18n="messageInfo">Message info</p>
      <p class="chat-sheet-preview" id="chatSheetPreview"></p>
      <div class="chat-info" id="chatInfo"></div>
      <p class="chat-sheet-note" id="chatSheetNote"></p>
      <div class="chat-sheet-actions" id="chatSheetActions">
        <button type="button" class="chat-sheet-btn" data-action="edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span data-i18n="editMessage">Edit message</span>
        </button>
        <button type="button" class="chat-sheet-btn is-danger" data-action="delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span data-i18n="deleteMessage">Delete message</span>
        </button>
      </div>
      <button type="button" class="chat-sheet-btn is-cancel" data-action="cancel" data-i18n="closeBtn">Close</button>
    </div>

  </div>

  <script src="parent-portal-chat-store.js"></script>
  <script src="parent-portal-chat.js"></script>
</body>
</html>
