<!DOCTYPE html>
<html lang="en">
<head>
  <script src="parent-portal-guard.js"></script>
  <script src="parent-portal-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <title data-i18n="docTitleChangePw">Change Password · Greenwood High</title>
  <script src="parent-portal-i18n.js"></script>
  <script src="parent-portal-students.js"></script>
  <link rel="stylesheet" href="parent-portal-core.css">
  <link rel="stylesheet" href="parent-portal-i18n.css">
</head>
<body class="page-changepw">

  <header class="cp-topbar">
    <a href="parent-portal-index.html" class="cp-back" aria-label="Back to home" data-i18n-aria="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="cp-topbar-title" data-i18n="changePassword">Change Password</h1>
  </header>

  <main class="cp-content">

    <section class="cp-hero">
      <div class="cp-hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </div>
      <div>
        <h2 data-i18n="cpHeroTitle">Update your password</h2>
        <p data-i18n="cpHeroText">Verify your phone number and current password, then choose a new 7-digit password.</p>
      </div>
    </section>

    <form id="changePasswordForm" novalidate>
      <div class="cp-form-error" id="formError" role="alert"></div>

      <!-- 1. Phone number -->
      <div class="cp-field" id="field-phone">
        <label class="cp-label" for="phone" data-i18n="cpPhone">Phone Number</label>
        <div class="cp-input-wrap">
          <svg class="cp-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input class="cp-input" style="padding-right:1rem" type="tel" id="phone" name="phone" inputmode="tel" placeholder="e.g. 0300 1234567" data-i18n-placeholder="cpPhonePh" autocomplete="tel" required>
        </div>
        <p class="cp-error" id="error-phone" role="alert"></p>
      </div>

      <!-- 2. Old password -->
        <div class="cp-field" id="field-oldPassword">
          <label class="cp-label" for="oldPassword" data-i18n="cpOld">Old Password</label>
          <div class="cp-input-wrap">
            <svg class="cp-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="cp-input" type="password" id="oldPassword" name="oldPassword" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Enter your current password" data-i18n-placeholder="cpOldPh" autocomplete="current-password" required>
            <button type="button" class="cp-toggle" data-target="oldPassword" aria-label="Show password" data-i18n-aria="cpShowPw"><svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <p class="cp-error" id="error-oldPassword" role="alert"></p>
        </div>

      <!-- 3. New password -->
        <div class="cp-field" id="field-newPassword">
          <label class="cp-label" for="newPassword" data-i18n="cpNew">New Password</label>
          <div class="cp-input-wrap">
            <svg class="cp-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="cp-input" type="password" id="newPassword" name="newPassword" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Create a new password" data-i18n-placeholder="cpNewPh" autocomplete="new-password" required>
            <button type="button" class="cp-toggle" data-target="newPassword" aria-label="Show password" data-i18n-aria="cpShowPw"><svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <p class="cp-error" id="error-newPassword" role="alert"></p>
          <ul class="cp-rules" id="rules">
            <li data-rule="length" data-i18n="cpRuleLength">Exactly 7 digits</li>
            <li data-rule="digits" data-i18n="cpRuleDigits">Numbers only (0–9)</li>
          </ul>
        </div>

      <!-- 4. Confirm new password -->
        <div class="cp-field" id="field-confirmPassword">
          <label class="cp-label" for="confirmPassword" data-i18n="cpConfirm">Confirm New Password</label>
          <div class="cp-input-wrap">
            <svg class="cp-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="cp-input" type="password" id="confirmPassword" name="confirmPassword" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="Re-enter your new password" data-i18n-placeholder="cpConfirmPh" autocomplete="new-password" required>
            <button type="button" class="cp-toggle" data-target="confirmPassword" aria-label="Show password" data-i18n-aria="cpShowPw"><svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <p class="cp-error" id="error-confirmPassword" role="alert"></p>
        </div>

      <button type="submit" class="cp-submit" id="submitBtn">
        <span class="cp-spinner" aria-hidden="true"></span>
        <span id="submitText" data-i18n="changePassword">Change Password</span>
      </button>
    </form>

    <!-- Success state -->
    <section class="cp-success" id="successBox" aria-live="polite">
      <div class="cp-success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 data-i18n="cpSuccessTitle">Password changed</h2>
      <p data-i18n="cpSuccessText">Your password has been updated. Use the new password the next time you log in.</p>
      <a href="parent-portal-index.html" class="cp-submit" data-i18n="backHomeBtn">Back to Home</a>
    </section>

  </main>

  <script src="parent-portal-change-password.js"></script>
</body>
</html>
